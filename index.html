<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公司資料異動查詢</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface2: #f0efec;
    --border: #e2e1dc;
    --text: #1a1a18;
    --text2: #6b6b66;
    --text3: #9b9b96;
    --accent: #1a5f3f;
    --accent-bg: #e8f4ee;
    --blue: #1850a0;
    --blue-bg: #e8eef8;
    --red: #9b2525;
    --red-bg: #faeaea;
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    height: 56px;
  }
  header h1 { font-size: 16px; font-weight: 600; color: var(--text) }
  header .sub { font-size: 12px; color: var(--text3) }

  .badge-src {
    margin-left: auto;
    font-size: 11px;
    padding: 3px 10px;
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 100px;
    font-weight: 500;
  }

  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
  }
  .stat-label { font-size: 12px; color: var(--text2); margin-bottom: 4px }
  .stat-val { font-size: 24px; font-weight: 600; color: var(--text) }
  .stat-val.sm { font-size: 15px; line-height: 1.8 }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    align-items: center;
  }

  .toolbar select, .toolbar input[type=text] {
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .toolbar input[type=text] { flex: 1; min-width: 200px }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--accent) }

  .btn {
    height: 36px;
    padding: 0 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface2) }
  .btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn.primary:hover { opacity: 0.88 }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .tbl-wrap { overflow-x: auto }
  table { width: 100%; border-collapse: collapse; font-size: 13px }
  th {
    padding: 10px 14px;
    text-align: left;
    font-weight: 500;
    color: var(--text2);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none }
  tr:hover td { background: var(--surface2) }
  td.mono { font-family: 'Courier New', monospace; letter-spacing: 0.03em }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 100px;
  }
  .badge-new { background: var(--accent-bg); color: var(--accent) }
  .badge-mod { background: var(--blue-bg); color: var(--blue) }

  .empty { text-align: center; padding: 4rem; color: var(--text3); font-size: 14px }

  .pager {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text2);
  }
  .pager .spacer { flex: 1 }

  .status-bar {
    margin-top: 12px;
    font-size: 12px;
    color: var(--text3);
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  .history-select { max-width: 180px }
</style>
</head>
<body>

<header>
  <h1>公司資料異動查詢</h1>
  <span class="sub">經濟部商業署 Open Data</span>
  <span class="badge-src">自動每日更新</span>
</header>

<main>
  <div class="stats">
    <div class="stat"><div class="stat-label">查詢日期</div><div class="stat-val sm" id="s-date">—</div></div>
    <div class="stat"><div class="stat-label">異動筆數</div><div class="stat-val" id="s-total">—</div></div>
    <div class="stat"><div class="stat-label">符合條件</div><div class="stat-val" id="s-filtered">—</div></div>
    <div class="stat"><div class="stat-label">資料更新時間</div><div class="stat-val sm" id="s-updated">—</div></div>
  </div>

  <div class="toolbar">
    <select id="sel-date" class="history-select" onchange="loadDate(this.value)">
      <option value="">選擇日期...</option>
    </select>
    <input type="text" id="q" placeholder="搜尋統一編號或公司名稱..." oninput="applyFilter()" />
    <button class="btn" onclick="exportCSV()">匯出 CSV</button>
  </div>

  <div class="card">
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>統一編號</th>
            <th>公司名稱</th>
            <th>核准日期</th>
            <th>狀態</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>

  <div class="status-bar" id="status">載入中...</div>
</main>

<script>
const PAGE = 50;
let allData = [], filtered = [], curPage = 0;

async function init() {
  try {
    const idx = await fetch('data/index.json').then(r => r.json());
    document.getElementById('s-updated').textContent =
      new Date(idx.updated_at).toLocaleString('zh-TW', {hour12: false});

    const sel = document.getElementById('sel-date');
    (idx.history || []).forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      sel.appendChild(opt);
    });

    if (idx.latest) {
      sel.value = idx.latest;
      await loadDate(idx.latest);
    }
  } catch(e) {
    status(`無法讀取索引：${e.message}（請確認 data/index.json 存在）`);
  }
}

async function loadDate(d) {
  if (!d) return;
  status('載入中...');
  try {
    const fname = d.replace(/-/g,'');
    allData = await fetch(`data/${fname}.json`).then(r => r.json());
    document.getElementById('s-date').textContent = d;
    document.getElementById('s-total').textContent = allData.length.toLocaleString();
    curPage = 0;
    applyFilter();
    status(`已載入 ${d} 資料，共 ${allData.length} 筆`);
  } catch(e) {
    status(`載入失敗：${e.message}`);
    document.getElementById('tbody').innerHTML = '<tr><td colspan="5" class="empty">無法載入資料</td></tr>';
  }
}

function applyFilter() {
  const q = document.getElementById('q').value.trim();
  filtered = q
    ? allData.filter(r => r.biz_no.includes(q) || r.name.includes(q))
    : [...allData];
  document.getElementById('s-filtered').textContent = filtered.length.toLocaleString();
  curPage = 0;
  render();
}

function render() {
  const start = curPage * PAGE;
  const page = filtered.slice(start, start + PAGE);
  const tbody = document.getElementById('tbody');

  if (!page.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">查無資料</td></tr>';
    document.getElementById('pager').innerHTML = '';
    return;
  }

  tbody.innerHTML = page.map((r, i) => {
    const idx = start + i + 1;
    const badge = `<span class="badge badge-mod">異動</span>`;
    return `<tr>
      <td style="color:var(--text3)">${idx}</td>
      <td class="mono">${esc(r.biz_no)}</td>
      <td>${esc(r.name)}</td>
      <td>${esc(r.date)}</td>
      <td>${badge}</td>
    </tr>`;
  }).join('');

  const pages = Math.ceil(filtered.length / PAGE);
  const pager = document.getElementById('pager');
  if (pages <= 1) { pager.innerHTML = ''; return; }
  pager.innerHTML = `
    <button class="btn" onclick="go(-1)" ${curPage===0?'disabled':''}>上一頁</button>
    <span>第 ${curPage+1} / ${pages} 頁</span>
    <span class="spacer"></span>
    <button class="btn" onclick="go(1)" ${curPage>=pages-1?'disabled':''}>下一頁</button>
  `;
}

function go(d) { curPage += d; render(); window.scrollTo(0,0); }

function exportCSV() {
  if (!filtered.length) return;
  const rows = [['統一編號','公司名稱','核准日期']];
  filtered.forEach(r => rows.push([r.biz_no, r.name, r.date]));
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  a.download = `公司異動_${document.getElementById('s-date').textContent}.csv`;
  a.click();
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function status(msg) {
  document.getElementById('status').textContent = msg;
}

init();
</script>
</body>
</html>
