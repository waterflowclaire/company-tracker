name: 每日抓取公司異動資料

on:
  schedule:
    - cron: '0 1 * * *'  # 每天台灣時間早上 9:00 (UTC+8 = UTC 01:00)
  workflow_dispatch:       # 也可手動觸發

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch company change data
        run: python scripts/fetch.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: 更新公司異動資料 $(date +'%Y-%m-%d')"
          git push
